<header>
    <h1>Lista de Atividades</h1>
</header>

<main>
    <section class="formulario">
        <!-- Por conta do FormsModule o Angular irá gerenciar o Submit do formulário -->
        <form (ngSubmit)="adicionar()" action="">
            <label for="nome">Atividade: </label>
            <!--[(ngModel)] = "nome" cria um vínculo de duas mãos com o TS-->
            <input type="text" id="nome" name="nome" [(ngModel)]="nome" placeholder="Nova Atividade">

            <button type="submit" (click)="adicionar()">Salvar</button>
            <button (click)="cancelar()">Limpar</button>
        </form>
    </section>

    <section>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Atividade</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <!-- Vamos Começar a fazer a varredura do vetor lista-->
            <tbody>

                @for (atividade of lista; track atividade.id){
                    <tr>
                <!-- Vínculo simples entre o html e TS  -> Somente leitura de valores -->
                        <td>{{atividade.id}}</td>
                        <td>{{atividade.nome}}</td>
                        <td>"Editar" | "Excluir"</td>
                    </tr>
                }

            </tbody>

        </table>
    </section>
</main>

<footer></footer>
